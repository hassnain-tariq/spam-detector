<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spam Detector - AI Powered</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      font-family: 'Courier New', monospace;
      color: #e0e0e0;
      padding: 24px;
    }
    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,255,100,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,100,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .container { max-width: 780px; margin: 0 auto; position: relative; }
    .header { margin-bottom: 36px; border-bottom: 1px solid #1a1a2a; padding-bottom: 20px; }
    .status { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #00ff64; animation: pulse 2s infinite;
    }
    .status-text { color: #00ff64; font-size: 11px; letter-spacing: 3px; }
    h1 { font-size: clamp(24px, 5vw, 36px); color: #fff; letter-spacing: 1px; }
    h1 span { color: #00ff64; }
    .subtitle { color: #555; font-size: 12px; margin-top: 6px; letter-spacing: 1px; }
    .examples-label { color: #444; font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; }
    .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .example-btn {
      background: transparent; border: 1px solid #333; color: #888;
      padding: 6px 14px; font-family: 'Courier New', monospace;
      font-size: 11px; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
    }
    .example-btn:hover { border-color: #00ff64; color: #00ff64; }
    textarea {
      background: #0d0d14; border: 1px solid #222; color: #c0c0c0;
      font-family: 'Courier New', monospace; font-size: 13px;
      padding: 16px; width: 100%; resize: vertical; outline: none;
      transition: border-color 0.2s; line-height: 1.6; margin-bottom: 16px;
    }
    textarea:focus { border-color: #00ff64; }
    .actions { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
    .btn-primary {
      background: #00ff64; color: #0a0a0f; border: none;
      padding: 12px 32px; font-family: 'Courier New', monospace;
      font-size: 14px; font-weight: bold; letter-spacing: 2px;
      cursor: pointer; transition: all 0.2s; text-transform: uppercase;
    }
    .btn-primary:hover { background: #00cc50; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .scanning { color: #00ff64; font-size: 12px; animation: pulse 1s infinite; }
    .error {
      border: 1px solid #ff4040; background: rgba(255,64,64,0.05);
      padding: 16px; color: #ff4040; font-size: 13px; margin-bottom: 20px;
    }
    .result { animation: slideIn 0.4s ease; }
    .verdict-banner {
      padding: 24px; margin-bottom: 20px;
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 16px;
    }
    .verdict-text { font-size: clamp(28px, 6vw, 42px); font-weight: bold; letter-spacing: 2px; }
    .verdict-label { font-size: 11px; color: #555; letter-spacing: 2px; margin-bottom: 6px; }
    .summary { color: #666; font-size: 12px; margin-top: 4px; }
    .confidence-num { font-size: 36px; font-weight: bold; color: #fff; }
    .risk-badge {
      display: inline-block; padding: 2px 10px;
      color: #0a0a0f; font-size: 11px; font-weight: bold;
      letter-spacing: 2px; margin-top: 6px;
    }
    .conf-bar-wrap { height: 4px; background: #1a1a2a; width: 100%; margin-bottom: 20px; }
    .conf-bar { height: 100%; transition: width 1s ease; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .card { background: #0d0d14; border: 1px solid #1a1a2a; padding: 18px; }
    .card-title { font-size: 10px; color: #444; letter-spacing: 2px; margin-bottom: 14px; }
    .reason { display: flex; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #aaa; align-items: flex-start; }
    .reason-arrow { color: #00ff64; flex-shrink: 0; }
    .flag { display: flex; gap: 8px; margin-bottom: 8px; font-size: 12px; color: #ff6060; align-items: flex-start; }
    .recommendation { padding: 16px; font-size: 12px; color: #777; letter-spacing: 0.5px; }
    .rec-label { font-weight: bold; }
    .footer { margin-top: 40px; border-top: 1px solid #1a1a2a; padding-top: 16px; text-align: center; color: #444; font-size: 11px; letter-spacing: 2px; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes slideIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .blink { animation: blink 0.8s infinite; }
    @media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="container">
    <div class="header">
      <div class="status">
        <div class="dot"></div>
        <span class="status-text">SYSTEM ACTIVE</span>
      </div>
      <h1>SPAM<span>_</span>DETECTOR</h1>
      <p class="subtitle">AI-POWERED EMAIL THREAT ANALYSIS // v2.4.1</p>
    </div>

    <p class="examples-label">LOAD EXAMPLE:</p>
    <div class="examples">
      <button class="example-btn" onclick="loadExample('phishing')">Phishing Example</button>
      <button class="example-btn" onclick="loadExample('legit')">Legitimate Email</button>
      <button class="example-btn" onclick="loadExample('scam')">Prize Scam</button>
    </div>

    <textarea id="emailInput" rows="10" placeholder="Paste email content here...

Include: From, Subject, Body

The AI agent will analyze for spam signals, phishing attempts, scam patterns, and more."></textarea>

    <div class="actions">
      <button class="btn-primary" id="analyzeBtn" onclick="analyzeEmail()">ANALYZE EMAIL</button>
      <span class="scanning" id="scanningText" style="display:none">SCANNING CONTENT<span class="blink">_</span></span>
      <button class="example-btn" id="clearBtn" onclick="clearAll()" style="display:none">CLEAR</button>
    </div>

    <div id="errorBox" class="error" style="display:none"></div>
    <div id="resultBox" style="display:none"></div>

    <div class="footer">POWERED BY HASSNAIN NIAZ TARIQ</div>
  </div>

  <script>
    const API_KEY = 'YOUR_API_KEY_HERE';

    const examples = {
      phishing: `From: security@paypa1.com\nSubject: URGENT: Your account has been suspended!\n\nDear Valued Customer,\n\nYour PayPal account has been LIMITED! Click here immediately to verify your identity or your account will be permanently deleted within 24 hours.\n\nClick here: http://paypal-secure-login.xyz/verify\n\nYou must provide: SSN, Credit Card Number, Bank Account Details\n\nACT NOW before it's too late!!!`,
      legit: `From: sarah.johnson@acmecorp.com\nSubject: Q3 Project Update - Meeting Tomorrow\n\nHi team,\n\nJust a quick reminder that we have our Q3 project review meeting tomorrow at 2 PM in Conference Room B.\n\nPlease come prepared with your status updates. The agenda has been shared on the company portal.\n\nLooking forward to seeing everyone there.\n\nBest,\nSarah`,
      scam: `CONGRATULATIONS!!! You've been selected as our LUCKY WINNER!!!\n\nYou have WON $1,000,000 in the International Lottery!\n\nTo claim your prize, send $500 processing fee via Western Union to:\nMr. John Smith, Lagos Nigeria\n\nReply with your: Full name, Address, Phone, Bank details\n\nLIMITED TIME OFFER - expires in 24 HOURS!!!\nDo not ignore this email - MONEY IS WAITING FOR YOU!!!`
    };

    function loadExample(key) {
      document.getElementById('emailInput').value = examples[key];
      document.getElementById('clearBtn').style.display = 'inline-block';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('errorBox').style.display = 'none';
    }

    function clearAll() {
      document.getElementById('emailInput').value = '';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('clearBtn').style.display = 'none';
    }

    async function analyzeEmail() {
      const emailText = document.getElementById('emailInput').value.trim();
      if (!emailText) return;

      document.getElementById('analyzeBtn').disabled = true;
      document.getElementById('scanningText').style.display = 'inline';
      document.getElementById('clearBtn').style.display = 'none';
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('errorBox').style.display = 'none';

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            system: `You are an expert email spam detection AI agent. Analyze the provided email content and determine if it is spam or not spam.\n\nRespond ONLY with a valid JSON object (no markdown, no backticks, no extra text) in this exact format:\n{\n  "verdict": "SPAM" or "NOT SPAM",\n  "confidence": a number from 0 to 100,\n  "risk_level": "LOW", "MEDIUM", or "HIGH",\n  "reasons": ["reason1", "reason2", "reason3"],\n  "red_flags": ["flag1", "flag2"] or [],\n  "summary": "A one sentence summary of your analysis"\n}`,
            messages: [{ role: 'user', content: `Analyze this email:\n\n${emailText}` }]
          })
        });

        const data = await response.json();
        const raw = data.content?.map(b => b.text || '').join('') || '';
        const clean = raw.replace(/```json|```/g, '').trim();
        const result = JSON.parse(clean);
        showResult(result);
      } catch (err) {
        document.getElementById('errorBox').textContent = '⚠ Analysis failed. Please check your API key and try again.';
        document.getElementById('errorBox').style.display = 'block';
      } finally {
        document.getElementById('analyzeBtn').disabled = false;
        document.getElementById('scanningText').style.display = 'none';
        document.getElementById('clearBtn').style.display = 'inline-block';
      }
    }

    function showResult(r) {
      const isSpam = r.verdict === 'SPAM';
      const color = isSpam ? '#ff3232' : '#00ff64';
      const bgColor = isSpam ? 'rgba(255,50,50,0.07)' : 'rgba(0,255,100,0.05)';
      const riskColor = r.risk_level === 'HIGH' ? '#ff3232' : r.risk_level === 'MEDIUM' ? '#ff9900' : '#00ff64';
      const barColor = isSpam ? 'linear-gradient(90deg, #ff3232, #ff6060)' : 'linear-gradient(90deg, #00aa44, #00ff64)';

      const reasons = (r.reasons || []).map(re => `<div class="reason"><span class="reason-arrow">→</span>${re}</div>`).join('');
      const flags = r.red_flags?.length > 0
        ? r.red_flags.map(f => `<div class="flag"><span>⚑</span>${f}</div>`).join('')
        : '<div style="font-size:12px;color:#555">No red flags detected.</div>';

      document.getElementById('resultBox').innerHTML = `
        <div class="result">
          <div class="verdict-banner" style="background:${bgColor};border:2px solid ${color}">
            <div>
              <div class="verdict-label">VERDICT</div>
              <div class="verdict-text" style="color:${color}">${isSpam ? '⚠ SPAM' : '✓ SAFE'}</div>
              <div class="summary">${r.summary}</div>
            </div>
            <div style="text-align:right">
              <div class="verdict-label">CONFIDENCE</div>
              <div class="confidence-num">${r.confidence}%</div>
              <div class="risk-badge" style="background:${riskColor}">${r.risk_level} RISK</div>
            </div>
          </div>
          <div class="conf-bar-wrap">
            <div class="conf-bar" style="width:${r.confidence}%;background:${barColor}"></div>
          </div>
          <div class="grid-2">
            <div class="card">
              <div class="card-title">ANALYSIS REASONS</div>
              ${reasons}
            </div>
            <div class="card">
              <div class="card-title">RED FLAGS DETECTED</div>
              ${flags}
            </div>
          </div>
          <div class="recommendation" style="background:${isSpam ? 'rgba(255,50,50,0.05)' : 'rgba(0,255,100,0.03)'};border:1px solid ${isSpam ? '#3a1010' : '#0a2a18'}">
            <span class="rec-label" style="color:${isSpam ? '#ff6060' : '#00cc50'}">RECOMMENDATION: </span>
            ${isSpam ? 'Do not click any links or reply to this email. Mark as spam and delete. Do not provide any personal information.' : 'This email appears to be legitimate. Exercise normal caution with any links or attachments.'}
          </div>
        </div>`;
      document.getElementById('resultBox').style.display = 'block';
    }
  </script>
</body>
</html>
